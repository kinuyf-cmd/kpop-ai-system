# webp_map.conf — /etc/nginx/conf.d/webp_map.conf へ配置(http スコープ)。
# nginx.conf の http{} 内 `include /etc/nginx/conf.d/*.conf;`(sites-enabled より前)で読み込まれる。
#
# map は if+set より信頼性が高く(if is evil 回避)、$http_accept から webp対応可否を導出する正攻法。
# Accept に image/webp があれば $webp_ext=".webp"、無ければ空。server 側でこの変数を使う。

map $http_accept $webp_ext {
    default        "";
    "~*image/webp" ".webp";
}
