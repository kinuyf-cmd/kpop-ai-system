# webp_nginx.conf — WebP透過配信 + uploads/static 長期キャッシュ。
# 既存 /etc/nginx/sites-enabled/kpopjournal.conf の server{} ブロックに 2か所貼り付ける。
#
# 重要(2026-05-25 既存conf確認反映):
#  - map は http{} 専用で kpopjournal.conf は server{} だけ → 使わず server直下の set+if で Accept 判定。
#  - if と try_files を「同じ location 内」に同居させると挙動が不安定("if is evil")。
#    → if/set は **server 直下**(location の外)に置き、location 側は try_files のみにする(安全形)。
#  - 既存 gzip は設定済み → 追加しない(重複禁止)。
#  - 正規表現 location は既存 `location /`(prefix)より優先評価。`location ~ \.php$` とは拡張子非衝突。
#
# ===== 貼り付け【その1】: server{ の直下(どの location よりも前。例: root/index の直後)=====
# Accept に image/webp があれば $webp_suffix=".webp"、無ければ空。
set $webp_suffix "";
if ($http_accept ~* "image/webp") {
    set $webp_suffix ".webp";
}

# ===== 貼り付け【その2】: 既存 `location / { ... }` の直前に、以下の location 群 =====
# uploads の png/jpg: .webp併設があれば優先配信(無ければ原本)。HTML/srcset変更不要。
location ~* ^/wp-content/uploads/.+\.(png|jpe?g)$ {
    add_header Vary "Accept" always;
    expires 365d;
    add_header Cache-Control "public, immutable" always;
    try_files ${uri}${webp_suffix} $uri =404;
}

# .webp 直リクエスト・画像・フォントの長期キャッシュ(uses-long-cache-ttl / cache-insight 対策)
location ~* \.(webp|svg|ico|gif|woff2?|ttf|eot)$ {
    expires 365d;
    add_header Cache-Control "public, immutable" always;
}

# 自社テーマ/プラグインの CSS・JS(?ver= filemtime でバスト)
location ~* ^/wp-content/(themes|plugins)/.+\.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public" always;
}
