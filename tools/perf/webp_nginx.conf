# webp_nginx.conf — WebP 透過配信 + uploads/static の長期キャッシュ。
# 本番 www.kpopjournal.tokyo の server{} ブロック内に include するか、内容を貼り付ける。
# webp_convert.sh で .webp 併設版を生成済みであることが前提。
# Lighthouse 対策: modern-image-formats(373KiB) + uses-long-cache-ttl(49 resources) + cache-insight(1262KiB)。
# 広告/計測JS(AdSense/GTM)は対象外=収益インフラに手を入れない。

# 1) ブラウザが WebP 対応なら .webp を優先配信(原本URLのまま透過置換)
#    http{} レベルで map を定義(既出なら重複させない)
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

# 以下は server{} 内に置く ───────────────────────────────

# uploads 配下の画像: .webp があれば優先、無ければ原本にフォールバック
location ~* ^/wp-content/uploads/.+\.(png|jpe?g)$ {
    add_header Vary "Accept" always;
    expires 365d;
    add_header Cache-Control "public, immutable" always;
    try_files ${uri}${webp_suffix} $uri =404;
}

# .webp 直リクエスト・その他静的画像/フォント/CSS/JS は長期キャッシュ
location ~* \.(webp|svg|ico|woff2?|ttf)$ {
    expires 365d;
    add_header Cache-Control "public, immutable" always;
}

# テーマ/プラグインの CSS・JS(自社静的): 30日キャッシュ(更新は filemtime ?ver= でバスト)
location ~* ^/wp-content/(themes|plugins)/.+\.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public" always;
}
