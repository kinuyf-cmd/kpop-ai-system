upstream kpopjournal_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# WordPress backend — IP direct (avoids DNS loop after cutover)
upstream wordpress_origin {
    server 160.251.148.187:443;
    keepalive 16;
}

# ── HTTP → HTTPS redirect + ACME ──
server {
    listen 80;
    listen [::]:80;
    server_name kpopjournal.tokyo www.kpopjournal.tokyo;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kpopjournal.tokyo www.kpopjournal.tokyo;

    # SSL (certbot will populate these)
    ssl_certificate     /etc/letsencrypt/live/kpopjournal.tokyo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kpopjournal.tokyo/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        application/wasm;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # WordPress paths → WordPress (IP direct)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    # WordPress REST API
    location /wp-json/ {
        proxy_pass https://160.251.148.187/wp-json/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_cache_valid 200 60s;
        proxy_read_timeout 30s;
    }

    # WordPress admin
    location /wp-admin/ {
        proxy_pass https://160.251.148.187/wp-admin/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_read_timeout 60s;
    }

    # WordPress login
    location = /wp-login.php {
        proxy_pass https://160.251.148.187/wp-login.php;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_read_timeout 60s;
    }

    # WordPress uploads (images)
    location /wp-content/uploads/ {
        proxy_pass https://160.251.148.187/wp-content/uploads/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # WordPress includes (CSS/JS)
    location /wp-includes/ {
        proxy_pass https://160.251.148.187/wp-includes/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WordPress cron
    location = /wp-cron.php {
        proxy_pass https://160.251.148.187/wp-cron.php;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
    }

    # Block xmlrpc
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Next.js paths
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    # Next.js static assets — immutable cache
    location /_next/static/ {
        proxy_pass http://kpopjournal_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://kpopjournal_next;
        expires 60d;
        add_header Cache-Control "public";
    }

    # Next.js all other routes
    location / {
        proxy_pass http://kpopjournal_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    client_max_body_size 64m;
}
