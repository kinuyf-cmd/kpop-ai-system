upstream kpopjournal_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP server (redirect + local WP API proxy for SSR builds)
server {
    listen 80;
    listen [::]:80;
    server_name kpopjournal.tokyo www.kpopjournal.tokyo;

    # Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # WordPress API — HTTPS to ConoHa Wing IP, skip cert verify (for SSR/build)
    location /wp-json/ {
        proxy_pass https://160.251.148.187/wp-json/;
        proxy_http_version 1.1;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # WordPress login page (HTTP → proxied to WP before redirect to HTTPS)
    location = /wp-login.php {
        proxy_pass https://160.251.148.187/wp-login.php;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
    }

    # WordPress includes
    location /wp-includes/ {
        proxy_pass https://160.251.148.187/wp-includes/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
    }

    # WordPress uploads — HTTPS, skip cert verify
    location /wp-content/ {
        proxy_pass https://160.251.148.187/wp-content/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Everything else → HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kpopjournal.tokyo www.kpopjournal.tokyo;

    ssl_certificate /etc/letsencrypt/live/kpopjournal.tokyo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kpopjournal.tokyo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://kpopjournal_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://kpopjournal_next;
    }

    # WordPress API — HTTPS to ConoHa Wing IP, skip cert verify
    location /wp-json/ {
        proxy_pass https://160.251.148.187/wp-json/;
        proxy_http_version 1.1;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # WordPress login page
    location = /wp-login.php {
        proxy_pass https://160.251.148.187/wp-login.php;
        proxy_http_version 1.1;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        proxy_read_timeout 30s;
    }

    # WordPress includes (JS/CSS/fonts for admin)
    location /wp-includes/ {
        proxy_pass https://160.251.148.187/wp-includes/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        add_header Cache-Control "public, max-age=604800";
    }

    # WordPress admin
    location /wp-admin/ {
        proxy_pass https://160.251.148.187/wp-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
    }

    # WordPress uploads
    location /wp-content/ {
        proxy_pass https://160.251.148.187/wp-content/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Google News Sitemap — ローカルXMLファイルを直接配信
    location = /news-sitemap.xml {
        alias /home/aiuser/kpop-ai-system/static/news-sitemap.xml;
        add_header Content-Type "text/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
    }

    # WordPress sitemaps — ConoHa Wingへプロキシ
    location ~* ^/(sitemap.*\.xml|wp-sitemap.*\.xml)$ {
        proxy_pass https://160.251.148.187/$1;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_ssl_verify off;
        add_header Cache-Control "public, max-age=3600";
    }


    # Owner Dashboard v2 (internal use, obscure URL, noindex)
    location /dash-kx7m2p-v2/ {
        alias /home/aiuser/kpopjournal-frontend/public/dash-kx7m2p-v2/;
        try_files $uri $uri/index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # All other routes → Next.js
    location / {
        proxy_pass http://kpopjournal_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

