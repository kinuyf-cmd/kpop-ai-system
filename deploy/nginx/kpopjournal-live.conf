upstream kpopjournal_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP server (also handles ACME challenge for certbot) ──
server {
    listen 80;
    listen [::]:80;
    server_name kpopjournal.tokyo www.kpopjournal.tokyo;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy everything to Next.js for now (SSL added later)
    location / {
        proxy_pass http://kpopjournal_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js static assets — immutable cache
    location /_next/static/ {
        proxy_pass http://kpopjournal_next;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://kpopjournal_next;
        proxy_cache_valid 200 3600;
    }

    # WordPress API passthrough
    location /wp-json/ {
        proxy_pass https://www.kpopjournal.tokyo/wp-json/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_cache_valid 200 60s;
        proxy_read_timeout 30s;
    }

    # WordPress admin passthrough
    location /wp-admin/ {
        proxy_pass https://www.kpopjournal.tokyo/wp-admin/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_read_timeout 60s;
    }

    # WordPress uploads (images)
    location /wp-content/uploads/ {
        proxy_pass https://www.kpopjournal.tokyo/wp-content/uploads/;
        proxy_set_header Host www.kpopjournal.tokyo;
        proxy_ssl_server_name on;
        proxy_ssl_name www.kpopjournal.tokyo;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        application/wasm;
}
