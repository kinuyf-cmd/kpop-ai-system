name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # tests / lib に /home/aiuser/kpop-ai-system が絶対パス直書き多数のため
      # runner workspace を当該パスへ symlink して既存テストを無改変で走らせる
      # (incremental に Path(__file__) ベースへ移行予定)
      - name: Symlink workspace to expected absolute path
        run: |
          sudo mkdir -p /home/aiuser
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/aiuser/kpop-ai-system
          ls -la /home/aiuser/kpop-ai-system | head -5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow beautifulsoup4 python-dotenv requests

      - name: Run pytest
        working-directory: /home/aiuser/kpop-ai-system
        run: python3 -m pytest tests/ -q --tb=short

      - name: memory rule coverage
        working-directory: /home/aiuser/kpop-ai-system
        run: python3 scripts/memory_test_coverage_dashboard.py
